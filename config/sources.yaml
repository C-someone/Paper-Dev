  - id: usenix_security_2026_accepted
    name: USENIX Security 2026 Cycle 1 Accepted Papers
    source_type: website_watch
    enabled: true
    watch_url: https://www.usenix.org/conference/usenixsecurity26/cycle1-accepted-papers
    css_selector: main
    ccf_level: A
    area: security
    venue_type: conference
    priority: 5
    status: needs_verification
    schedule:
      interval_seconds: 86400
    metadata:
      paper_selector: "main li"
      paper_title_selector: "a"
      paper_link_selector: "a"
    tags:
      - ccf_a
      - security

  - id: nsdi_2026_technical_sessions
    name: NSDI 2026 Technical Sessions
