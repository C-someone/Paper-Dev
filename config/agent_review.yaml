agent_review:
  enabled: true
  default_reviewer: pydantic_ai
  pydantic_ai:
    model: deepseek-v4-pro
    model_env: DEEPSEEK_API_MODEL
    api_key_env: DEEPSEEK_API_KEY
    base_url_env: DEEPSEEK_API_URL
  policy:
    monitor_min_confidence: 0.85
    needs_review_min_confidence: 0.55
    max_results_per_review: 10
