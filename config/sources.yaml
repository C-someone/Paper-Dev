      paper_title_selector: "a"
      paper_link_selector: "a"
    tags:
      - ccf_a
      - network

  - id: ndss_2026_accepted
    name: NDSS 2026 Accepted Papers
    source_type: website_watch
    enabled: true
    watch_url: https://www.ndss-symposium.org/ndss2026/accepted-papers/
    css_selector: main
    ccf_level: A
    area: security
    venue_type: conference
    priority: 5
    status: needs_verification
    schedule:
      interval_seconds: 86400
    metadata:
      paper_selector: "main li"
      paper_title_selector: "a"
      paper_link_selector: "a"
    tags:
      - ccf_a
      - security

  - id: ieee_sp_2026_accepted
    name: IEEE S&P 2026 Accepted Papers
    source_type: website_watch
    enabled: true
    watch_url: https://sp2026.ieee-security.org/accepted-papers.html
    css_selector: div.container
    ccf_level: A
    area: security
    venue_type: conference
    priority: 5
    status: needs_verification
    schedule:
      interval_seconds: 86400
    metadata:
      conference_page_mode: bootstrap_list_group
      conference_content_selector: div.container
      paper_selector: "div.list-group-item"
      paper_title_selector: "a"
      paper_link_selector: "a"
      paper_author_selector: "div.collapse.authorlist"
    tags:
      - ccf_a
      - security

  - id: sigcomm_2026_accepted
    name: SIGCOMM 2026 Accepted Papers
    source_type: website_watch
    enabled: true
    watch_url: https://conferences.sigcomm.org/sigcomm/2026/accepted/
    css_selector: div.main-content
    ccf_level: A
    area: network
    venue_type: conference
    priority: 5
    status: needs_verification
    schedule:
      interval_seconds: 86400
    metadata:
      conference_page_mode: table_rows
      conference_content_selector: div.main-content
      paper_selector: "div.main-content tr, table tr"
      paper_title_selector: "b"
      paper_author_selector: "span.table-description"
    tags:
      - ccf_a
      - network

